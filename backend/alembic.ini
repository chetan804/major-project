# ===========================================================================
# Alembic configuration — EcoMind-AI
#
# The database URL is NOT stored here. It is read from the application settings
# (MIGRATION_DATABASE_URL) by migrations/env.py, so a credential never lives in a
# tracked file (master directive, section 56).
#
# Migrations use the SYNC driver (psycopg2) while the application uses asyncpg.
# That is deliberate: migration code is inherently sequential, and running it
# through an async engine adds an event-loop bridge for no benefit. Both point at
# the same database.
# ===========================================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Dated filenames so that migrations sort chronologically in a directory listing
# even though the revision chain (not the filename) is what Alembic follows.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
# Detect column type changes rather than silently ignoring them.
# (compare_type is set in env.py via context.configure.)
truncate_slug_length = 60
# Abort rather than prompt when the database is behind, so CI never hangs.
[alembic:post_write_hooks]

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
